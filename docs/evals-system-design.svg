<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -6 1570 946" width="1570" height="946" font-family="Helvetica, Arial, sans-serif">
<title>Eval suite system design</title>
<defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1e1e1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#868e96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="10" y="-6" width="1570" height="946" fill="#ffffff"/>
<rect x="30" y="215" width="1140" height="585" rx="14" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text text-anchor="start" font-size="14" fill="#343a40"><tspan x="360" y="780.88">run_case(): one run.   run_evals() repeats it for every case × --repeats, until --max-cost.</tspan></text>
<rect x="60" y="60" width="280" height="100" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="200" y="95.81">1 · evals/cases.jsonl</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="200" y="118.63">26 cases, tagged dev or heldout</tspan><tspan x="200" y="136.13">world_seed · prompt · checks</tspan></text>
<rect x="580" y="60" width="260" height="100" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="710" y="95.81">release.json · prompts/ · skills/</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="710" y="118.63">what is being evaluated:</tspan><tspan x="710" y="136.13">model, prompt version, budgets</tspan></text>
<rect x="60" y="260" width="240" height="110" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="180" y="300.81">2 · make_world(seed)</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="180" y="323.63">seeded CRM + payments backend</tspan><tspan x="180" y="341.13">same seed, same world</tspan></text>
<rect x="330" y="232" width="190" height="84" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="425" y="259.81">3 · setup_chats</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="425" y="282.63">memory cases only:</tspan><tspan x="425" y="300.13">earlier chats → memory</tspan></text>
<rect x="580" y="260" width="260" height="110" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="710" y="300.81">4 · Agent.run(prompt)</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="710" y="323.63">the real agent loop</tspan><tspan x="710" y="341.13">calls tools until it stops</tspan></text>
<rect x="920" y="260" width="220" height="110" rx="10" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="1030" y="300.81">Claude API</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="1030" y="323.63">the real model</tspan><tspan x="1030" y="341.13">(FakeLLM in offline tests)</tspan></text>
<rect x="60" y="470" width="240" height="90" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="180" y="500.81">before</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="180" y="523.63">deep copy of the world,</tspan><tspan x="180" y="541.13">taken before the run</tspan></text>
<rect x="460" y="470" width="260" height="90" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="590" y="509.56">Backend after the run</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="590" y="532.38">meetings · refunds · notes</tspan></text>
<rect x="780" y="470" width="260" height="90" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="910" y="509.56">RunResult</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="910" y="532.38">tool_calls · stop · reply · cost</tspan></text>
<rect x="60" y="650" width="1080" height="100" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="600" y="685.81">5 · Checkers: CHECKS[name](before, after, result, **args)</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="600" y="708.63">followups_booked · refund_exact · needs_approval · asked_user · meeting_minutes · …</tspan><tspan x="600" y="726.13">each returns None when the requirement holds, or the reason it failed</tspan></text>
<rect x="60" y="830" width="280" height="90" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="200" y="869.56">6 · Outcome</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="200" y="892.38">passed? · failure reasons · cost</tspan></text>
<rect x="420" y="830" width="340" height="90" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="590" y="860.81">7 · Report</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="590" y="883.63">pass counts by family</tspan><tspan x="590" y="901.13">terminal table + JSON in evals/runs/</tspan></text>
<rect x="840" y="830" width="300" height="90" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="990" y="860.81">8 · Gate</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="990" y="883.63">exit 1 below --min-pass,</tspan><tspan x="990" y="901.13">or if the cost cap cut the run short</tspan></text>
<rect x="1230" y="400" width="280" height="170" rx="10" fill="#ffdeeb" stroke="#c2255c" stroke-width="2"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="1370" y="435.81">9 · You</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="1370" y="458.63">read the failures</tspan><tspan x="1370" y="476.13">change prompt, skills or harness</tspan><tspan x="1370" y="493.63">rerun dev</tspan><tspan x="1370" y="528.63">heldout: run rarely,</tspan><tspan x="1370" y="546.13">never tune on its failures</tspan></text>
<rect x="1230" y="650" width="280" height="100" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/>
<text text-anchor="middle" font-size="18" fill="#1e1e1e"><tspan x="1370" y="685.81">tests/test_evals.py</tspan></text>
<text text-anchor="middle" font-size="14" fill="#343a40"><tspan x="1370" y="708.63">scripted runs with known verdicts</tspan><tspan x="1370" y="726.13">check the checkers, offline</tspan></text>
