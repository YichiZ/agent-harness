<polyline points="590,560 590,650" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<polyline points="910,560 910,650" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<polyline points="200,750 200,830" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<polyline points="340,875 420,875" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<polyline points="760,875 840,875" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<polyline points="1140,875 1550,875 1550,485 1510,485" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<polyline points="1370,400 1370,110 840,110" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<polyline points="1440,400 1440,30 200,30 200,60" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ink)"/>
