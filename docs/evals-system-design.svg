<text text-anchor="start" font-size="13" fill="#343a40"><tspan x="190" y="189.96">world_seed</tspan></text>
<text text-anchor="start" font-size="13" fill="#343a40"><tspan x="470" y="159.96">prompt</tspan></text>
<text text-anchor="start" font-size="13" fill="#343a40"><tspan x="720" y="189.96">model · prompt · budgets</tspan></text>
<text text-anchor="middle" font-size="13" fill="#343a40"><tspan x="440" y="363.96">the world (a Backend)</tspan></text>
<text text-anchor="middle" font-size="13" fill="#343a40"><tspan x="880" y="303.96">messages</tspan></text>
<text text-anchor="middle" font-size="13" fill="#343a40"><tspan x="880" y="333.96">tool calls</tspan></text>
<text text-anchor="start" font-size="13" fill="#343a40"><tspan x="190" y="423.96">copy</tspan></text>
<text text-anchor="start" font-size="13" fill="#343a40"><tspan x="650" y="423.96">tools write</tspan></text>
<text text-anchor="start" font-size="13" fill="#343a40"><tspan x="820" y="423.96">returns</tspan></text>
<text text-anchor="middle" font-size="13" fill="#343a40"><tspan x="1345" y="893.96">pass rates and failure reasons</tspan></text>
<text text-anchor="middle" font-size="13" fill="#343a40"><tspan x="1105" y="99.96">change what is being evaluated</tspan></text>
<text text-anchor="middle" font-size="13" fill="#343a40"><tspan x="820" y="19.96">a new failure becomes a new case</tspan></text>
